<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EWB Telecaller Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
.header{background:#111827;color:white;padding:18px 22px;text-align:center}
.header h1{margin:0;font-size:24px}
.header p{margin:6px 0 0;color:#cbd5e1}
.container{max-width:700px;margin:35px auto;padding:0 18px}
.card{background:white;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
.counter{font-size:14px;color:#64748b;margin-bottom:18px}
.student{font-size:25px;font-weight:700;margin-bottom:8px;word-break:break-word}
.course{color:#64748b;margin-bottom:22px;min-height:20px}
.number{font-size:27px;font-weight:700;letter-spacing:1px;margin:15px 0 25px}
.call{display:block;text-decoration:none;background:#16a34a;color:white;font-size:22px;font-weight:700;padding:17px;border-radius:13px;margin-bottom:18px}
.call:hover{background:#15803d}
.nav{display:flex;gap:12px}
.nav button{flex:1;border:0;padding:15px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer}
.prev{background:#e2e8f0;color:#334155}
.next{background:#2563eb;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
.caller-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.caller-bar label{font-weight:700}
.caller-bar select{flex:1;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;background:white}
.search{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;margin-bottom:20px}
.two-students{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:center}
.student-box{border:1px solid #e2e8f0;border-radius:14px;padding:18px}
.next-box{background:#f8fafc}
.small-label{font-size:12px;font-weight:800;color:#64748b;margin-bottom:12px}
.status{margin-top:20px}
.status select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
@media(max-width:600px){
.two-students{grid-template-columns:1fr}
.next-box{display:block}
}
@media(max-width:500px){
.container{margin:18px auto}
.card{padding:22px 16px}
.student{font-size:22px}
.number{font-size:23px}
}
</style>
</head>
<body>
<div class="header">
  <h1>EWB Courses — Telecaller</h1>
  <p>One-click calling dashboard</p>
</div>

<div class="container">
  <div class="caller-bar">
  <label for="caller">Telecaller:</label>
  <select id="caller" onchange="setCaller()">
    <option value="1">Telecaller 1 — Students 1–797</option>
    <option value="2">Telecaller 2 — Students 798–1593</option>
  </select>
</div>
<input id="search" class="search" placeholder="Search assigned students by name or phone...">
  <div class="card">
    <div id="counter" class="counter"></div>
    <div class="two-students">
      <div class="student-box">
        <div class="small-label">CURRENT</div>
        <div id="student" class="student"></div>
        <div id="course" class="course"></div>
        <div id="number" class="number"></div>
        <a id="callBtn" class="call" href="#">📞 Call Now</a>
      </div>
      <div class="student-box next-box">
        <div class="small-label">NEXT</div>
        <div id="nextStudent" class="student"></div>
        <div id="nextCourse" class="course"></div>
        <div id="nextNumber" class="number"></div>
      </div>
    </div>

    <div class="nav">
      <button id="prevBtn" class="prev" onclick="previous()">← Previous</button>
      <button id="nextBtn" class="next" onclick="next()">Next →</button>
    </div>

    <div class="status">
      <select id="status" onchange="saveStatus()">
        <option value="">Call Status</option>
        <option>Not Called</option>
        <option>Called</option>
        <option>Interested</option>
        <option>Not Interested</option>
        <option>Follow-up</option>
        <option>Wrong Number</option>
      </select>
    </div>
  </div>
</div>

let assigned = [];
let filtered = [];
let index = 0;
let caller = "1";

function getAssigned() {
  const midpoint = Math.ceil(students.length / 2);
  return caller === "1" ? students.slice(0, midpoint) : students.slice(midpoint);
}

function setCaller() {
  caller = document.getElementById("caller").value;
  index = 0;
  document.getElementById("search").value = "";
  assigned = getAssigned();
  filtered = assigned;
  render();
}

function phoneForDial(phone) {
  let p = String(phone).trim().replace(/[^0-9+]/g, "");
  if (p.startsWith("0")) p = "+91" + p.substring(1);
  else if (/^[6-9][0-9]{9}$/.test(p)) p = "+91" + p;
  return p;
}

function render() {
  if (!filtered.length) {
    document.getElementById("counter").textContent = "0 students found";
    document.getElementById("student").textContent = "No student found";
    document.getElementById("course").textContent = "";
    document.getElementById("number").textContent = "";
    document.getElementById("nextStudent").textContent = "";
    document.getElementById("nextCourse").textContent = "";
    document.getElementById("nextNumber").textContent = "";
    document.getElementById("callBtn").style.display = "none";
    document.getElementById("prevBtn").disabled = true;
    document.getElementById("nextBtn").disabled = true;
    return;
  }

  const s = filtered[index];
  const n = filtered[index + 1];

  document.getElementById("counter").textContent =
    `Telecaller ${caller} • Showing ${index + 1}${n ? " and " + (index + 2) : ""} of ${filtered.length}`;
  document.getElementById("student").textContent = s.name || "Student";
  document.getElementById("course").textContent = s.course || "";
  document.getElementById("number").textContent = s.phone || "No phone number";

  const dial = phoneForDial(s.phone);
  const callBtn = document.getElementById("callBtn");
  callBtn.style.display = dial ? "block" : "none";
  callBtn.href = dial ? "tel:" + dial : "#";

  document.getElementById("nextStudent").textContent = n ? (n.name || "Student") : "No more students";
  document.getElementById("nextCourse").textContent = n ? (n.course || "") : "";
  document.getElementById("nextNumber").textContent = n ? (n.phone || "No phone number") : "";

  document.getElementById("prevBtn").disabled = index === 0;
  document.getElementById("nextBtn").disabled = index >= filtered.length - 2;

  const saved = localStorage.getItem("ewb_status_" + (students.indexOf(s)));
  document.getElementById("status").value = saved || "";
}

function next() {
  if (index < filtered.length - 1) {
    index++;
    render();
  }
}

function previous() {
  if (index > 0) {
    index--;
    render();
  }
}

function saveStatus() {
  if (!filtered.length) return;
  const s = filtered[index];
  localStorage.setItem("ewb_status_" + students.indexOf(s),
    document.getElementById("status").value);
}

document.getElementById("search").addEventListener("input", function() {
  const q = this.value.toLowerCase().trim();
  filtered = assigned.filter(s =>
    String(s.name).toLowerCase().includes(q) ||
    String(s.phone).toLowerCase().includes(q)
  );
  index = 0;
  render();
});

assigned = getAssigned();
filtered = assigned;
render();
</script>
